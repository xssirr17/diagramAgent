spring:
  profiles:
    default: gemini-api
    active: ${SPRING_PROFILES_ACTIVE:gemini-api}
    group:
      cli:
        - cli
        - gemini-api
      mcp:
        - mcp
        - gemini-api
      mcp-web:
        - mcp-web
        - gemini-api
  ai:
    mcp:
      server:
        enabled: false

diagram:
  allowed-root: ${DIAGRAM_ROOT:.}
  max-context-chars: 60000
  max-retries: 2
  max-depth: 4
  agentic: false
  max-tool-calls: 15
  mermaid-cli-path: mmdc
  max-files-scanned: ${DIAGRAM_MAX_FILES_SCANNED:5000}
  max-file-size-bytes: 1048576
  cache:
    enabled: ${DIAGRAM_CACHE_ENABLED:true}
    max-projects: ${DIAGRAM_CACHE_MAX_PROJECTS:5}
    ttl-minutes: ${DIAGRAM_CACHE_TTL_MINUTES:30}
    results: ${DIAGRAM_CACHE_RESULTS:false}

---
spring:
  config:
    activate:
      on-profile: gemini-api
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:${GEMINI_API_KEY:dummy-api-key}}
        chat:
          options:
            model: ${DIAGRAM_MODEL:gemini-3.5-flash}
            temperature: 0.1
            max-output-tokens: 4000

---
spring:
  config:
    activate:
      on-profile: vertex
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID:}
          location: ${GCP_LOCATION:us-central1}
          chat:
            options:
              model: ${DIAGRAM_MODEL:gemini-2.5-flash}
              temperature: 0.1
              max-output-tokens: 4000

---
spring:
  config:
    activate:
      on-profile: mcp
  main:
    banner-mode: "off"
  ai:
    mcp:
      server:
        enabled: true
        name: diagram-agent
        version: 0.0.1
        stdio: ${MCP_STDIO:true}
        type: sync

---
spring:
  config:
    activate:
      on-profile: mcp-web
  ai:
    mcp:
      server:
        enabled: true
        name: diagram-agent
        version: 0.0.1
        stdio: false
        protocol: sse
        type: sync

