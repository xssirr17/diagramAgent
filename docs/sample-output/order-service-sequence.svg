<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <style>
      .actor { fill: #f8fafc; stroke: #334155; stroke-width: 2px; font-family: sans-serif; font-weight: bold; }
      .line { stroke: #64748b; stroke-width: 1.5px; stroke-dasharray: 4 4; }
      .arrow { stroke: #2563eb; stroke-width: 2px; marker-end: url(#arrowhead); }
      .return-arrow { stroke: #64748b; stroke-width: 1.5px; stroke-dasharray: 4 4; marker-end: url(#arrowhead); }
      .text { font-family: sans-serif; font-size: 12px; fill: #1e293b; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="30" y="20" width="100" height="40" rx="4" class="actor" />
  <text x="80" y="45" text-anchor="middle" class="text" font-weight="bold">Client</text>
  <line x1="80" y1="60" x2="80" y2="360" class="line" />

  <rect x="220" y="20" width="140" height="40" rx="4" class="actor" />
  <text x="290" y="45" text-anchor="middle" class="text" font-weight="bold">OrderController</text>
  <line x1="290" y1="60" x2="290" y2="360" class="line" />

  <rect x="440" y="20" width="120" height="40" rx="4" class="actor" />
  <text x="500" y="45" text-anchor="middle" class="text" font-weight="bold">OrderService</text>
  <line x1="500" y1="60" x2="500" y2="360" class="line" />

  <!-- Calls -->
  <line x1="80" y1="100" x2="280" y2="100" class="arrow" />
  <text x="180" y="92" text-anchor="middle" class="text">POST /orders/{id}/pay</text>

  <line x1="290" y1="160" x2="490" y2="160" class="arrow" />
  <text x="390" y="152" text-anchor="middle" class="text">payOrder(id)</text>

  <line x1="490" y1="240" x2="295" y2="240" class="return-arrow" />
  <text x="390" y="232" text-anchor="middle" class="text">Order (PAID)</text>

  <line x1="290" y1="300" x2="85" y2="300" class="return-arrow" />
  <text x="180" y="292" text-anchor="middle" class="text">200 OK</text>
</svg>
